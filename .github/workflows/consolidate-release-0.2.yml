name: Consolidate release 0.2 docs

on:
  push:
    branches:
      - docs/consolidate-release-0.2.0

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7.0.1
        with:
          ref: docs/consolidate-release-0.2.0
          fetch-depth: 0

      - name: Consolidate release archive
        run: python .github/scripts/consolidate_release_0_2.py

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f docs/releases/0.2.0.md
          test ! -e docs/RELEASE_0_2.md
          test ! -e docs/RELEASE_0_2_SMOKE_2026-08-11.md
          test ! -e docs/RELEASE_0_2_FOLLOWUPS_2026-08-11.md
          if git grep -n 'docs/RELEASE_0_2' -- '*.md'; then
            echo 'Stale 0.2 release references remain'
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: consolidate 0.2 release archive"
          git push origin HEAD:docs/consolidate-release-0.2.0
