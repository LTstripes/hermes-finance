name: R02-27 finalize release docs

on:
  push:
    branches:
      - agent/r02-27-passive-goal-actual-average

permissions:
  contents: write

jobs:
  finalize-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7.0.1
        with:
          ref: agent/r02-27-passive-goal-actual-average
          fetch-depth: 0

      - name: Finalize release records
        run: python .github/scripts/r02_27_finalize_docs.py

      - name: Commit final release records
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RELEASE_0_2.md docs/RELEASE_0_2_SMOKE_2026-08-11.md docs/RELEASE_0_2_FOLLOWUPS_2026-08-11.md
          git commit -m "R02-27: mark passive-goal semantics done"
          git push origin HEAD:agent/r02-27-passive-goal-actual-average
