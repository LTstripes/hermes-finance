name: Release metadata sync

on:
  push:
    branches:
      - release/0.8.0
    paths:
      - .github/workflows/release-metadata-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v7.0.1
        with:
          ref: release/0.8.0
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.0'

      - name: Refresh generated release metadata
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && uv lock)
          (cd frontend && npm version 0.8.0 --no-git-tag-version --allow-same-version)
          git rm .github/workflows/release-metadata-sync.yml

      - name: Commit generated metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock frontend/package.json frontend/package-lock.json
          git diff --cached --check
          git commit -m "release: sync generated 0.8.0 metadata"
          git push origin HEAD:release/0.8.0
