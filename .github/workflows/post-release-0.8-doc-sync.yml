name: Post-release 0.8 docs sync

on:
  push:
    branches:
      - post-release/0.8.0-docs-sync

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out docs branch
        uses: actions/checkout@v7.0.1
        with:
          ref: post-release/0.8.0-docs-sync
          fetch-depth: 0

      - name: Synchronize canonical 0.8.0 docs
        run: python3 scripts/post_release_08_docs_sync.py

      - name: Remove one-shot coordination files
        run: |
          rm -f .github/workflows/post-release-0.8-doc-sync.yml
          rm -f scripts/post_release_08_docs_sync.py
          rm -f docs/post-release-trigger.txt
          rm -f docs/post-release-0.8.0-sync.md
          rm -f docs/releases/0.8.0-post-release-sync-checklist.md
          rm -f docs/releases/README.md

      - name: Commit synchronized docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: sync published 0.8.0 state"
          git push origin HEAD:post-release/0.8.0-docs-sync
