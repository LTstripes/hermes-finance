name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    name: Privacy guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Check tracked files for private data
        run: python3 scripts/privacy_check.py

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked backend dependencies
        run: uv sync --locked --group dev

      - name: Lint backend
        run: uv run --locked ruff check .

      - name: Check backend formatting
        run: uv run --locked ruff format --check .

      - name: Test backend
        run: uv run --locked python -I -m pytest -q

  backend-timezone-windows:
    name: Backend timezone (Windows tzdata regression)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked backend dependencies (includes tzdata)
        run: uv sync --locked --group dev

      - name: Verify Europe/Moscow resolves via tzdata without a system IANA DB
        shell: pwsh
        run: |
          uv run --locked python -I -c "from zoneinfo import ZoneInfo; z = ZoneInfo('Europe/Moscow'); print('resolved', z.key)"

      - name: Run Moscow timezone and AI Analysis Bundle tests
        run: uv run --locked python -I -m pytest -q tests/test_moscow_tz.py tests/test_ai_analysis_bundle_contract.py tests/test_ai_analysis_bundle_export.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Check frontend formatting
        run: npm run format-check

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  release-safety:
    name: Release safety
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run guarded release synthetic tests
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\test-release.ps1
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\test-release-request.ps1
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\test-release-workflow.ps1
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

  windows-production-smoke:
    name: Windows production smoke
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run canonical production smoke
        shell: pwsh
        run: |
          $env:HERMES_FINANCE_DATABASE_PATH = Join-Path $env:RUNNER_TEMP "hermes-finance-smoke.db"

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\start-local.ps1 -ExitAfterReady
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          if (-not (Test-Path $env:HERMES_FINANCE_DATABASE_PATH -PathType Leaf)) {
              throw "Canonical launcher did not create the temporary SQLite database."
          }

          $listener = Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue
          if ($null -ne $listener) {
              throw "Canonical launcher left port 8000 listening after -ExitAfterReady."
          }

  windows-launcher-safety:
    name: Windows launcher safety
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and run launcher safety harness
        shell: pwsh
        run: |
          dotnet build .\launcher\windows\HermesFinance.Launcher.SafetyTests\HermesFinance.Launcher.SafetyTests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          dotnet run --project .\launcher\windows\HermesFinance.Launcher.SafetyTests\HermesFinance.Launcher.SafetyTests.csproj --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
