name: R02-21 lock refresh

on:
  push:
    branches:
      - agent/r02-21-release-metadata

permissions:
  contents: write

jobs:
  refresh-lock-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v7.0.1
        with:
          ref: agent/r02-21-release-metadata

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Refresh backend lock metadata
        working-directory: backend
        run: uv lock

      - name: Refresh frontend lock metadata
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lock metadata only
        shell: bash
        run: |
          git diff -- backend/uv.lock frontend/package-lock.json
          git diff --quiet -- backend/uv.lock frontend/package-lock.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock frontend/package-lock.json
          git commit -m "R02-21: sync lock metadata for 0.2.0"
          git push origin HEAD:agent/r02-21-release-metadata
