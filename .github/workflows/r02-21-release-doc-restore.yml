name: R02-21 preserve release task cards

on:
  push:
    branches:
      - agent/r02-21-release-metadata

permissions:
  contents: write

jobs:
  preserve-release-history:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch with history
        uses: actions/checkout@v7.0.1
        with:
          ref: agent/r02-21-release-metadata
          fetch-depth: 0

      - name: Restore and synchronize detailed release backlog
        run: python .github/scripts/r02_21_restore_release.py

      - name: Commit detailed synchronized release backlog
        shell: bash
        run: |
          git diff -- docs/RELEASE_0_2.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RELEASE_0_2.md
          git commit -m "R02-21: preserve detailed release task cards"
          git push origin HEAD:agent/r02-21-release-metadata
