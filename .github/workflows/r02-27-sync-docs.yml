name: R02-27 sync release docs

on:
  push:
    branches:
      - agent/r02-27-passive-goal-actual-average

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7.0.1
        with:
          ref: agent/r02-27-passive-goal-actual-average
          fetch-depth: 0

      - name: Synchronize R02-27 docs
        run: python .github/scripts/r02_27_sync_docs.py

      - name: Commit synchronized docs
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md docs/PROJECT_WIKI.md docs/RELEASE_0_2.md docs/RELEASE_0_2_SMOKE_2026-08-11.md docs/RELEASE_0_2_FOLLOWUPS_2026-08-11.md
          git commit -m "R02-27: document actual-average goal semantics"
          git push origin HEAD:agent/r02-27-passive-goal-actual-average
