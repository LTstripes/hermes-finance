name: UI comparison evidence

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ui-v2-evidence.yml"

permissions:
  contents: read

jobs:
  ui-evidence:
    name: Synthetic UI comparison
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture synthetic comparison and v2 behavior
        run: npm run audit:visual -- --project=1440x900 --grep "^(dashboard:|monthly-close:|ui-v2)"

      - name: Collect allowlisted public evidence
        if: success()
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p ../ui-v2-evidence/screenshots
          cp .visual-audit/1440x900/*.png ../ui-v2-evidence/screenshots/
          cp -R dist ../ui-v2-evidence/frontend-dist
          printf '{"candidate_sha":"%s","data":"synthetic API fixtures only","runtime":"no backend or provider"}\n' "$CANDIDATE_SHA" > ../ui-v2-evidence/provenance.json

      - name: Retain synthetic screenshots and public frontend build
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-v2-evidence-${{ github.event.pull_request.head.sha }}
          path: ui-v2-evidence/
          if-no-files-found: error
          retention-days: 7
