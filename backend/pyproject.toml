[project]
name = "hermes-finance-backend"
version = "0.8.0"
description = "Local FastAPI backend for Hermes Finance"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.116,<1.0",
    "httpx2>=2.9.1",
    "jsonschema>=4.25,<5.0",
    "openpyxl>=3.1,<4.0",
    "pydantic-settings>=2.10,<3.0",
    "pypdf>=6.0,<7.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.scripts]
hermes-finance-api = "hermes_finance.cli:main"
hermes-finance-seed = "hermes_finance.private_seed_cli:main"
hermes-finance-legacy-mapping = "hermes_finance.legacy_month_mapping_cli:main"
hermes-finance-legacy-extract = "hermes_finance.legacy_excel_cli:main"
hermes-finance-legacy-preview = "hermes_finance.legacy_migration_preview_cli:main"
hermes-finance-legacy-migrate = "hermes_finance.legacy_migration_cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "jsonschema>=4.25,<5.0",
    "pytest>=8.4,<9.0",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_finance"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "domain: pure financial/domain invariants and exact boundary rules",
    "api: HTTP, DTO, status, and error contract coverage",
    "service: application service orchestration and cross-entity behavior",
    "persistence: database and persisted-state contract coverage",
    "migration: schema upgrade, downgrade, and data-preservation coverage",
    "integration: provider, quote, payout, and reconciliation boundaries",
    "import_export: statement, export, bundle, seed, and interchange paths",
    "legacy: supported legacy compatibility and migration paths",
    "runtime: startup, local security, settings, and launcher runtime behavior",
    "release: release-safety and task acceptance contract coverage",
    "benchmark: explicit performance or long-history measurement lanes",
    "windows: Windows-specific path, timezone, and launcher behavior",
    "network_free: synthetic tests that assert or require offline behavior",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
